name: Deploy Zygo Surface Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate public assets
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readdir, lstat} from 'node:fs/promises';
          const allowed = ['index.html','style.css','app.js','analysis.js','advanced.js','charts.js','export.js','worker.js','interaction.js','upload.js','help.js','help-examples.js'].sort();
          const actual = (await readdir('site')).sort();
          if (JSON.stringify(actual) !== JSON.stringify(allowed)) throw Error('Unexpected public asset');
          for (const name of actual) if (!(await lstat(`site/${name}`)).isFile()) throw Error('Only regular app files may be deployed');
          JS
          for file in site/*.js; do node --input-type=module --check < "$file"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
